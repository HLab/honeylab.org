<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.description }}{% endif %}</title>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/images/logo/favicon.png' | relative_url }}" type="image/png">
{% seo %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": "Honey Lab",
  "alternateName": "Honey Lab at Johns Hopkins University",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}/assets/images/logo/brain-hex-transparent-bg.png",
  "description": "{{ site.description }}",
  "parentOrganization": {
    "@type": "CollegeOrUniversity",
    "name": "Johns Hopkins University",
    "url": "https://www.jhu.edu/"
  },
  "founder": {
    "@type": "Person",
    "name": "Christopher Honey",
    "jobTitle": "Principal Investigator",
    "affiliation": {
      "@type": "CollegeOrUniversity",
      "name": "Johns Hopkins University"
    }
  }
}
</script>
<!-- noscript colors must match SCSS: $color-background, $color-border, $color-text-muted -->
<noscript><style>
    .landing-page #hexGrid,
    .landing-page .landing-overlay,
    .landing-page .landing-spacer { display: none !important; }
    .landing-page .site-nav {
        background: #fff !important;
        border-bottom: 1px solid #ebebeb !important;
    }
    .landing-page .site-nav .nav-logo {
        opacity: 1 !important;
        pointer-events: auto !important;
    }
    .landing-page .site-nav .nav-links a {
        color: #999 !important;
    }
</style></noscript>
